# Landing page: static files that GitHub Actions uploads to /var/www/landing
# (user "landing", its key may only rsync into that folder).
# Installed as /etc/nginx/conf.d/crmgelos.ru.conf; the security headers are in snippets/crmgelos-landing-security.conf.
# The stub version of this file: /etc/nginx/crmgelos.ru.conf.stub-backup
server {
    listen 80;
    listen [::]:80;
    server_name crmgelos.ru;

    # Do not show the nginx version (also set for the whole server in 00-default.conf)
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crmgelos.ru;
    include /etc/nginx/snippets/crmgelos-ssl.conf;

    server_tokens off;

    root /var/www/landing;

    # The browser re-checks the page on every visit, so a new version shows up at once
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/crmgelos-landing-security.conf;
    }

    # Astro puts a content hash into these file names: a changed file gets a new name
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/crmgelos-landing-security.conf;
    }
}
