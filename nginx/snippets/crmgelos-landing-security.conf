# Security headers of the landing (crmgelos.ru). Installed as /etc/nginx/snippets/crmgelos-landing-security.conf.
# nginx does not inherit add_header into a location that has its own add_header,
# so every location of the landing includes this file. "always" adds the headers to 404 pages too.

# HTTPS only for a year. No includeSubDomains: app.crmgelos.ru is not covered by this rule.
add_header Strict-Transport-Security "max-age=31536000" always;

# No nonce: inline scripts and styles of the page are allowed, everything else only from our own site.
# frame-ancestors 'none' forbids showing the page inside someone else's frame.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Old browsers do not know frame-ancestors, this header does the same
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
